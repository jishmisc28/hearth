name: contract

# One live run per UTC day. Gemini if that key exists, Nova on Bedrock Converse
# if that key exists. A chat-completions URL in BEDROCK_ENDPOINT is ignored.
# Output length is capped in the tests. A second click the same day stops
# before any model is called, and that stop is a success. A failed model
# step does not block a retry the same day.
on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: hearth-contract
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv pip install -e ".[dev,gemini,openai]"
      - name: Require a provider key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ] && [ -z "$BEDROCK_API_KEY" ]; then
            echo "Set GEMINI_API_KEY or BEDROCK_API_KEY as a repository secret."
            exit 1
          fi
      - name: Stop a second live run today
        id: spend
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          already=false
          today=$(date -u +%Y-%m-%d)
          ids=$(gh run list --workflow=contract.yml --created "$today" --limit 30 --json databaseId,status --jq '.[] | select(.status=="completed") | .databaseId')
          for id in $ids; do
            hit=$(gh run view "$id" --json jobs --jq '.jobs[].steps[]? | select(.name=="make contract" and .conclusion=="success") | .name')
            if [ -n "$hit" ]; then
              echo "Run $id already called a model today ($today UTC) and passed. Not starting another."
              already=true
              break
            fi
          done
          echo "already=$already" >> "$GITHUB_OUTPUT"
      - name: make contract
        if: steps.spend.outputs.already != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
          BEDROCK_ENDPOINT: ${{ secrets.BEDROCK_ENDPOINT }}
        run: make contract
