name: live-session

# Manual. questions and tools stop before $1. broad stops before $5.
on:
  workflow_dispatch:
    inputs:
      case:
        description: "questions or tools stay under $1. broad tries more models under $5."
        required: true
        default: questions
        type: choice
        options:
          - questions
          - tools
          - broad

permissions:
  contents: read

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv pip install -e ".[gemini]"
      - name: Live session
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
          BEDROCK_ENDPOINT: ${{ secrets.BEDROCK_ENDPOINT }}
          LIVE_CASE: ${{ inputs.case }}
        run: |
          if [ "$LIVE_CASE" = "broad" ]; then
            python bench/live_broad.py
          else
            python bench/live_session.py
          fi
