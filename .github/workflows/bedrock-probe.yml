name: bedrock-probe

# Manual only. Nova Micro, Nova Lite, and one cheap Claude Haiku.
# The script stops before the estimated bill reaches $1.
# gpt-oss is not called.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "One model id. Leave empty for Nova plus one cheap Claude."
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv pip install -e .
      - name: Probe
        env:
          BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
          BEDROCK_ENDPOINT: ${{ secrets.BEDROCK_ENDPOINT }}
          PROBE_ONLY: ${{ inputs.only }}
        run: python bench/bedrock_probe.py
