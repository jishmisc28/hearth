name: publish

# Publishes hearth-ai when a v* tag is pushed.
# PyPI must trust this repository (trusted publishing, environment name: pypi)
# before the first tag. Pushing the tag is the publish.
on:
  push:
    tags:
      - "v*"

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Build
        run: uv build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
