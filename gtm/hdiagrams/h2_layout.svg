<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" width="100%" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-label="Layout"><defs></defs><rect width="940" height="360" fill="white"/><text x="20" y="28.0" font-size="12.5" font-weight="650" fill="#0f172a" text-anchor="start">Typical agent: timestamp at the top of the system prompt</text><rect x="20" y="40" width="146" height="46" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/><text x="93.0" y="64.5" font-size="11" font-weight="650" fill="#b91c1c" text-anchor="middle">system + time ✗</text><rect x="170" y="40" width="126" height="46" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/><text x="233.0" y="64.5" font-size="11" font-weight="650" fill="#b91c1c" text-anchor="middle">tools</text><rect x="300" y="40" width="386" height="46" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/><text x="493.0" y="64.5" font-size="11" font-weight="650" fill="#b91c1c" text-anchor="middle">history (steps 1…n−1)</text><rect x="690" y="40" width="106" height="46" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/><text x="743.0" y="64.5" font-size="11" font-weight="650" fill="#b91c1c" text-anchor="middle">retrieved</text><rect x="800" y="40" width="106" height="46" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/><text x="853.0" y="64.5" font-size="11" font-weight="650" fill="#b91c1c" text-anchor="middle">new turn</text><text x="20" y="106" font-size="11" font-weight="600" fill="#b91c1c" text-anchor="start">Byte 212 changes every call, so everything after it is rewritten at full price: read share ≈ 0%.</text><text x="20" y="148.0" font-size="12.5" font-weight="650" fill="#0f172a" text-anchor="start">Same content, Hearth layout</text><rect x="20" y="160" width="106" height="46" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/><text x="73.0" y="184.5" font-size="11" font-weight="650" fill="#15803d" text-anchor="middle">tools</text><rect x="130" y="160" width="126" height="46" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/><text x="193.0" y="184.5" font-size="11" font-weight="650" fill="#15803d" text-anchor="middle">system</text><rect x="260" y="160" width="106" height="46" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/><text x="313.0" y="184.5" font-size="11" font-weight="650" fill="#15803d" text-anchor="middle">pinned memory</text><rect x="370" y="160" width="296" height="46" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/><text x="518.0" y="184.5" font-size="11" font-weight="650" fill="#15803d" text-anchor="middle">history (append-only)</text><rect x="670" y="160" width="146" height="46" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/><text x="743.0" y="184.5" font-size="11" font-weight="650" fill="#b45309" text-anchor="middle">time · recalled · notes</text><rect x="820" y="160" width="86" height="46" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/><text x="863.0" y="184.5" font-size="11" font-weight="650" fill="#b45309" text-anchor="middle">new turn</text><text x="20" y="226" font-size="11" font-weight="600" fill="#15803d" text-anchor="start">Everything before the volatile tail is identical to the last call, so it is read at ~0.1× price.</text><line x1="20" y1="270" x2="670" y2="270" stroke="#94a3b8" stroke-width="1.4"/><text x="345" y="290" font-size="11" font-weight="650" fill="#15803d" text-anchor="middle">cached prefix (STATIC → SESSION → APPEND)</text><line x1="670" y1="262" x2="670" y2="278" stroke="#94a3b8" stroke-width="1.4"/><text x="800" y="290" font-size="11" font-weight="650" fill="#b45309" text-anchor="middle">written / uncached tail</text><text x="470" y="330.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">Mid-session changes (new memory, git status, the time) go to the tail, never into the prefix.</text></svg>